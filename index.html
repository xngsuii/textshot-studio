<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>textshot studio</title>
<meta name="description" content="텍스트와 HTML을 이미지로 발췌하는 개인용 도구">
<!-- U+FE0E(VS15)를 붙여 컬러 이모지 대신 흑백 텍스트 글리프로 그린다 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='92' fill='%2314746F'>🎬︎</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Pretendard 는 js/fonts.js 가 불러온다. dynamic-subset 판은 @font-face 가 300개 가까이라
     캡쳐할 때 그 폰트 조각을 전부 내려받느라 멈춘다. 통짜 variable 판 하나만 쓴다. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/jszip.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🎬︎</span>
    <span class="brand-name">textshot<span class="brand-thin"> studio</span></span>
  </div>
  <span class="save-hint" id="saveHint"></span>
  <div class="spacer"></div>
  <div class="toggle" id="tabToggle" role="tablist">
    <span class="toggle-thumb" id="toggleThumb"></span>
    <button class="toggle-opt is-active" role="tab" data-tab="text" aria-selected="true">텍스트 발췌</button>
    <button class="toggle-opt" role="tab" data-tab="html" aria-selected="false">HTML</button>
  </div>
</header>

<main class="workspace" id="workspace">

  <!-- ══════════ 왼쪽: 편집기 ══════════ -->
  <aside class="pane-editor" id="editorPane">

    <!-- ── 텍스트 발췌 ── -->
    <div class="tabpane is-active" data-pane="text">

      <div class="fmt-bar">
        <div class="fmt-row">
          <div class="fmt-group">
            <button class="fmt-btn" data-wrap="**" title="굵게 (다시 누르면 해제)"><b>B</b></button>
            <button class="fmt-btn" data-wrap="*" title="행동지문"><span class="s-action">*행동*</span></button>
            <button class="fmt-btn" data-wrap="&quot;" title="대사"><span class="s-quote">&quot;대사&quot;</span></button>
            <button class="fmt-btn" data-wrap="_" title="기울임"><em>I</em></button>
            <button class="fmt-btn" data-wrap="==" title="형광펜"><span class="s-hl">형광펜</span></button>
          </div>
          <div class="fmt-group" id="slotBar"></div>
        </div>
        <div class="fmt-row">
          <span class="fmt-tag">프로필</span>
          <div class="prof-bar" id="profileBar"></div>
        </div>
        <div class="fmt-row">
          <div class="fmt-group">
            <button class="fmt-btn" data-prefix="# " title="제목">제목</button>
            <button class="fmt-btn" data-prefix="## " title="부제목">부제목</button>
            <button class="fmt-btn" data-prefix="&gt; " title="인용구">인용</button>
            <button class="fmt-btn" data-fence="1" title="코드블럭">코드블럭</button>
            <button class="fmt-btn" id="insertImage" title="커서 자리에 사진을 넣습니다">사진</button>
          </div>
          <div class="fmt-group">
            <button class="fmt-btn" data-line="---" title="구분선">— 구분선</button>
            <button class="fmt-btn fmt-split" data-line="===" title="분할선">✂ 분할선</button>
          </div>
          <div class="fmt-spacer"></div>
          <button class="fmt-btn fmt-strip" id="stripText" title="선택한 곳(없으면 전체)의 마커를 걷어냅니다">서식 지우기</button>
          <button class="fmt-btn fmt-clear" id="clearText" title="서식 설정은 두고 내용만 지웁니다">내용 지우기</button>
        </div>
      </div>

      <textarea id="src" class="src" spellcheck="false" placeholder="지문을 붙여넣으세요.

**굵게**   *행동지문*   &quot;대사&quot;   _기울임_   ==형광펜==   (괄호)
# 제목   ## 부제목   &gt; 인용구   &gt;2 인용구(색 슬롯 2)
---  구분선      ===  분할선"></textarea>

      <div class="settings">
        <div class="set-tabs" id="setTabs"></div>
        <div class="set-body" id="textSettings"></div>
      </div>
    </div>

    <!-- ── HTML ── -->
    <div class="tabpane" data-pane="html">
      <div class="fmt-bar">
        <div class="fmt-row">
          <div class="fmt-spacer"></div>
          <button class="fmt-btn fmt-clear" id="clearHtml">내용 지우기</button>
        </div>
      </div>
      <textarea id="htmlSrc" class="src src-code" spellcheck="false" placeholder="&lt;style&gt;
  .card { width: 600px; padding: 32px; background: #fff; }
&lt;/style&gt;

&lt;div class=&quot;card&quot;&gt;내용&lt;/div&gt;"></textarea>
      <div class="settings">
        <div class="set-body" id="htmlSettings"></div>
      </div>
    </div>

  </aside>

  <!-- ══════════ 오른쪽: 미리보기 ══════════ -->
  <section class="pane-preview">
    <div class="preview-bar">
      <div class="seg" id="zoomSeg">
        <button class="seg-btn is-active" data-zoom="fit">맞춤</button>
        <button class="seg-btn" data-zoom="1">100%</button>
        <button class="seg-btn" data-zoom="0.5">50%</button>
      </div>
      <div class="seg" id="splitSeg" hidden>
        <button class="seg-btn is-active" data-split="before">분할 전</button>
        <button class="seg-btn" data-split="after">분할 후</button>
      </div>
      <label class="check"><input type="checkbox" id="checkerBg"> 투명 확인</label>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="resetBtn" title="글은 두고 설정만 기본값으로">설정 초기화</button>
      <button class="btn btn-ghost" id="collapseBtn">편집기 닫기</button>
      <button class="btn btn-ghost" id="copyBtn">클립보드 복사</button>
      <button class="btn btn-primary" id="saveBtn">이미지 저장</button>
    </div>

    <div class="preview-scroll" id="previewScroll">
      <div class="stage-host" id="stageHost"></div>
    </div>

    <div class="preview-status">
      <span class="dims" id="dims">—</span>
      <span class="status-msg" id="statusMsg"></span>
    </div>
  </section>

</main>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
